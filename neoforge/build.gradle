plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${publish_name}-neo-${minecraft_version}"
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = "${publish_name}-neoforge-${minecraft_version}"
        }
    }
}

dependencies {

    localRuntime("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"){transitive = false}
    localRuntime("curse.maven:carry-on-274259:5649344"){transitive = false}

    compileOnly("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"){transitive = false}
    compileOnly("curse.maven:carry-on-274259:5649344"){transitive = false}

/*
    localRuntime( "curse.maven:sodium-394468:6382651"){transitive = false}
    localRuntime("curse.maven:irisshaders-455508:6661598"){transitive = false}
*/

    jarJar(implementation("net.nikdo53:nikdo-color:1.0.0"))
  //  additionalRuntimeClasspath("net.nikdo53:nikdo-color:1.0.0")

    localRuntime "curse.maven:starcatcher-1357603:8431589"
    localRuntime("net.abraxator:MoreSnifferFlowers:6.7")

}
