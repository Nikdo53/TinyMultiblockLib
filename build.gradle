plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15-SNAPSHOT' apply(false)
    id 'net.neoforged.moddev' version '2.0.107' apply(false)
}

subprojects {
    apply plugin: 'maven-publish'

    publishing {
        repositories {
            maven {
                url = "$rootDir/build/maven"
            }
        }
    }
}