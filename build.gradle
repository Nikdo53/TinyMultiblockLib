plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.144' apply false
}

subprojects {
    apply plugin: 'maven-publish'

    publishing {
        repositories {
            maven {
                url = "$rootDir/build/maven"
            }
        }
    }
}