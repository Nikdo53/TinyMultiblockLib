plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

base {
    archivesName = "${publish_name}-fabric-${minecraft_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    localRuntime("curse.maven:carry-on-274259:8562911")
    compileOnly("curse.maven:carry-on-274259:8562911")

    include(implementation("net.nikdo53:nikdo-color:1.0.0"))

    // config
    localRuntime("com.terraformersmc:modmenu:20.0.1")
    implementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${config_api_version}")

}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = "${publish_name}-fabric-${minecraft_version}"
        }
    }
}

publishMods {
    file = tasks.jar.archiveFile
    modLoaders.add("fabric")

    File changeLog = rootProject.file("CHANGELOG.md")
    String changeLogText = changeLog.exists() ? changeLog.text : ""

    def uploadDependenciesCf = [
            'fabric-api'           : true,
            'forge-config-api-port': true
    ]
    def uploadDependenciesMr = [
            'fabric-api'           : true,
            'forge-config-api-port': true
    ]


    if (project.hasProperty('curseforge_id')) {
        curseforge('curseforgeFabric') {
            displayName = "$mod_name $project.version - Fabric $minecraft_version"
            accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
            projectId = project.findProperty('curseforge_id')
            minecraftVersions.add(project.minecraft_version)
            changelog = changeLogText
            clientRequired = true
            serverRequired = true

            uploadDependenciesCf.each { dep, required ->
                if (required) {
                    requires(dep)
                } else {
                    optional(dep)
                }
            }
        }
    }

    if (project.hasProperty('modrinth_id')) {
        modrinth('modrinthFabric') {
            displayName = "$mod_name $project.version - Fabric $minecraft_version"
            accessToken = providers.environmentVariable('MODRINTH_TOKEN')
            projectId = project.findProperty('modrinth_id')
            minecraftVersions.add(project.minecraft_version)
            changelog = changeLogText

            dependencies {
                uploadDependenciesMr.each { dep, required ->
                    if (required) {
                        requires(dep)
                    } else {
                        optional(dep)
                    }
                }
            }
        }
    }

}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
